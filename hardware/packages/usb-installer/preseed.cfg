# MILES — préconfiguration Debian 13 (trixie) pour installation AUTOMATIQUE.
# Instancié par build-iso.sh : les jetons de mots de passe (double arobaz +
# suffixe + double arobaz) sont remplacés à la construction (hashes SHA-512
# saisis par l'utilisateur — JAMAIS stockés dans ce fichier ni dans Git).
#
# Règles :
# - disque cible = premier disque NON amovible et NON amovible-USB (la clé
#   d'installation est exclue explicitement, cf. Debian bug #847166) ;
# - utilisateur `miles` (sudo), root sans login ;
# - aucun secret embarqué : la clé API MILES se saisit APRÈS, avec
#   `python3 miles.py --setup`.
# - le provisionnement MILES se fait au PREMIER BOOT (systemd oneshot),
#   pas pendant l'installation : réseau et systemd sont alors pleinement
#   disponibles, et l'installation reste rapide.

### Localisation
d-i debian-installer/locale string fr_FR.UTF-8
d-i localechooser/supported-locales multiselect fr_FR.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i keyboard-configuration/layoutcode string fr
d-i keyboard-configuration/variantcode string
d-i keyboard-configuration/modelcode string pc105
d-i console-setup/ask_detect boolean false

### Réseau (Ethernet DHCP — indispensable à la netinst)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string miles-box
d-i netcfg/get_domain string localdomain
d-i netcfg/hostname string miles-box
d-i netcfg/wireless_wep string

### Miroir officiel (Debian 13 = trixie)
d-i mirror/country string fr
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Comptes — mots de passe hashés injectés par build-iso.sh
d-i passwd/root-login boolean false
d-i passwd/root-password-crypted password @@MILES_ROOT_HASH@@
d-i passwd/make-user boolean true
d-i passwd/user-fullname string MILES
d-i passwd/username string miles
d-i passwd/user-password-crypted password @@MILES_USER_HASH@@
d-i passwd/user-default-groups string audio cdrom video sudo netdev plugdev bluetooth

### Horloge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Partitionnement — premier disque NON amovible, effacement intégral.
### La clé d'installation (USB/CD) est exclue du disque cible.
### Cible UEFI (HP ProDesk + VM testée en EFI) : table GPT + ESP.
d-i partman-partitioning/default_label string gpt
d-i partman/early_command string \
    USBDEV=$(mount | grep -E '/cdrom|/hd-media' | head -n1 | cut -d' ' -f1 | sed 's/[0-9]*$//'); \
    TARGET=""; \
    for MYDEV in $(list-devices disk); do \
        case "$MYDEV" in "$USBDEV"*) continue;; esac; \
        REM=$(cat /sys/block/$(basename "$MYDEV")/removable 2>/dev/null || echo 0); \
        if [ "$REM" = "1" ]; then continue; fi; \
        TARGET="$MYDEV"; break; \
    done; \
    if [ -z "$TARGET" ]; then TARGET=$(list-devices disk | head -n1); fi; \
    debconf-set partman-auto/disk "$TARGET"; \
    debconf-set grub-installer/bootdev "$TARGET"; \
    echo "MILES preseed : disque cible = $TARGET (exclu : $USBDEV)" > /var/log/syslog
d-i partman-auto/method string regular
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/expert_recipe string atomic ::                \
      512 512 512 fat32                                        \
              $iflabel{ gpt }                                  \
              $reusemethod{ }                                  \
              method{ efi } format{ } .                        \
      512 512 512 ext4                                         \
              $primary{ } $bootable{ }                         \
              method{ format } format{ }                       \
              use_filesystem{ } filesystem{ ext4 }             \
              mountpoint{ /boot } .                            \
      8192 16384 16384 linux-swap                              \
              $primary{ }                                      \
              method{ swap } format{ } .                       \
      8000 12000 -1 ext4                                       \
              $primary{ }                                      \
              method{ format } format{ }                       \
              use_filesystem{ } filesystem{ ext4 }             \
              mountpoint{ / } .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Paquets — minimal + SSH + Python (aucun bureau)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/use_mirror boolean true
d-i pkgsel/include string sudo ca-certificates curl python3 python3-venv git
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/upgrade select safe-upgrade
d-i pkgsel/update-policy select none

### Bootloader (UEFI ou legacy)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### Fin � provisionnement MILES au 1er boot.
### late_command : appel d un script embarque dans l ISO (plus robuste que
### les continuations backslash). Le script cree le marqueur, copie la
### payload, active le service et restreint SSH a 127.0.0.1.
d-i preseed/late_command string /cdrom/files/miles-late.sh

d-i finish-install/reboot_in_progress note

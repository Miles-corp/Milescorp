; Paquet ESP32-S3 — firmware MILES Box.
;
; Aucun identifiant n'est présent ici : les valeurs ci-dessous sont des
; marqueurs. Le firmware REFUSE de démarrer tant qu'ils n'ont pas été
; remplacés, et affiche la raison sur la liaison série.
;
; Configuration réelle : créer `platformio.local.ini` (non versionné, ignoré
; par .gitignore) et le passer au build :;   pio run -c platformio.local.ini -t upload
;
;   [env:miles-box]
;   platform = espressif32
;   board = esp32-s3-devkitc-1
;   framework = arduino
;   monitor_speed = 115200
;   build_flags =
;       -DWIFI_SSID=\"mon_ssid\"
;       -DWIFI_PASS=\"mon_mot_de_passe\"
;       -DBACKEND_URL=\"http://192.168.1.42:8095\"
;       -DBOX_KEY=\"<MILES_BOX_KEY du backend>\"
;
; BACKEND_URL doit désigner l'adresse privée du PC : 127.0.0.1 désignerait
; l'ESP32 lui-même et le firmware le refuse désormais.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; BACKEND_URL n'est volontairement PAS definie ici : sans definition, le
; firmware compile mais refuse de démarrer (aucune adresse de bouclage par
; defaut). La valeur reelle est injectee par platformio.local.ini.
build_flags =
    -DWIFI_SSID=\"REPLACE_ME\"
    -DWIFI_PASS=\"REPLACE_ME\"
    -DBOX_KEY=\"REPLACE_ME\"
    -DPOLL_INTERVAL_MS=10000
